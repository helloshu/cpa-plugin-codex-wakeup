name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu zip

      - name: Test
        run: go test -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Race test
        run: go test -race -count=1 ./...

      - name: Build Linux AMD64
        env:
          GOOS: linux
          GOARCH: amd64
        run: ./scripts/build.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Build and verify companion management page
        run: bash scripts/build-management.sh

      - name: Set up browser smoke test
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-browser" playwright@1.58.2
          "$RUNNER_TEMP/codex-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Smoke test with CLIProxyAPI v7.3.3
        run: |
          cpa_dir=$(mktemp -d)
          trap 'rm -rf "$cpa_dir"' EXIT
          curl --fail --location --retry 3 \
            https://github.com/router-for-me/CLIProxyAPI/releases/download/v7.3.3/CLIProxyAPI_7.3.3_linux_amd64.tar.gz \
            --output "$cpa_dir/cpa.tar.gz"
          echo '7af8c99cd08eee3ccc81d1596e8a31785674d3de6bd7ec61416d59493dd8fc01  '"$cpa_dir/cpa.tar.gz" | sha256sum --check
          tar -xzf "$cpa_dir/cpa.tar.gz" -C "$cpa_dir" cli-proxy-api
          NODE_PATH="$RUNNER_TEMP/codex-browser/node_modules" python3 scripts/smoke-host.py \
            --host "$cpa_dir/cli-proxy-api" --plugin dist/linux/amd64/codex-wakeup.so \
            --management-html dist/management/management.html --browser-test

      - name: Build Linux ARM64
        env:
          CC: aarch64-linux-gnu-gcc
          GOOS: linux
          GOARCH: arm64
        run: ./scripts/build.sh

      - name: Package release assets
        run: |
          version=$(sed -n 's/^[[:space:]]*pluginVersion = "\([^"]*\)"/\1/p' main.go)
          ./scripts/package-release.sh "$version"

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: codex-wakeup-release-packages
          path: dist/release/*
          if-no-files-found: error
